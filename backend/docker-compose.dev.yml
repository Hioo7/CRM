services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.local
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      target: builder
    command: sh -c "npm run start:docker"
    env_file: .env.local
    environment:
      DATABASE_URL: postgresql://crm_user:crm_pass_dev@postgres:5432/crm_dev
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_dev_data:
